<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<!--
  WebOwl social share card — 1200x630.
  This is the SOURCE for og-image.png. Edit here, then re-render:
  see render command in the deploy notes. Not linked from the site.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" />
<style>
  :root {
    --night: #0E1428;
    --night-2: #151D38;
    --night-3: #1C2647;
    --paper: #F2EFE6;
    --paper-dim: #A8AEC4;
    --amber: #E8B04B;
    --line-2: rgba(242, 239, 230, 0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--night);
    color: var(--paper);
    font-family: "Inter", system-ui, sans-serif;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute; top: -36%; right: -14%;
    width: 720px; height: 720px;
    background: radial-gradient(circle, rgba(232,176,75,0.20) 0%, rgba(232,176,75,0) 66%);
    pointer-events: none;
  }
  .frame {
    position: absolute; inset: 0;
    padding: 72px 84px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand .mark { width: 64px; height: 64px; }
  .brand .name { font-family: "Fraunces", Georgia, serif; font-size: 44px; font-weight: 600; letter-spacing: -0.01em; }
  .status {
    display: inline-flex; align-items: center; gap: 13px;
    background: var(--night-2); border: 1px solid var(--line-2);
    padding: 13px 22px; border-radius: 999px;
    font-size: 21px; font-weight: 500; color: var(--paper-dim);
  }
  .status .dot { width: 13px; height: 13px; border-radius: 50%; background: #2ECC71; box-shadow: 0 0 0 6px rgba(46,204,113,.18); }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 500; letter-spacing: -0.015em; line-height: 1.04;
    font-size: 92px; max-width: 17ch;
  }
  h1 .accent { color: var(--amber); font-style: italic; }
  .bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
  .sub { font-size: 26px; color: var(--paper-dim); max-width: 30ch; line-height: 1.4; }
  .url {
    font-size: 24px; font-weight: 600; color: var(--amber);
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="frame">
    <div class="top">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#151D38"/>
          <circle cx="16" cy="16" r="7" stroke="#E8B04B" stroke-width="2"/>
          <circle cx="16" cy="16" r="2.5" fill="#E8B04B"/>
          <path d="M16 4 v3 M16 25 v3 M4 16 h3 M25 16 h3" stroke="#E8B04B" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="name">WebOwl</span>
      </div>
      <span class="status"><span class="dot"></span> Altijd online</span>
    </div>

    <h1>De site die <span class="accent">nooit slaapt</span>.</h1>

    <div class="bottom">
      <p class="sub">Snelle, professionele websites voor lokale ondernemers in en rond Antwerpen.</p>
      <span class="url">webowl.be</span>
    </div>
  </div>
</body>
</html>
